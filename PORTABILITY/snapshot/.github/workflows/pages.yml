name: Hosted builds from master

# On every push to main, publishes the site to GitHub Pages: the repo as it
# stands (desk page included, MASTER.md left out) plus live/<output>, the
# always-current builds assembled from Blueprint/MASTER.md by Blueprint/assemble.js.
# Nothing is committed, checked against itself or written back to the master.
# DIRECTORY.txt and DIRECTORY.yaml are generated from the master's Directory
# block on every deployment. Skill zips are not built here: Blueprint/UPLOAD
# holds the last generated set.
# Pages must be set to deploy from GitHub Actions (Settings > Pages > Source).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble hosted outputs
        run: |
          node -e '
            const fs = require("fs"), A = require("./Blueprint/assemble.js");
            const m = A.parse(fs.readFileSync("Blueprint/MASTER.md", "utf8"));
            fs.mkdirSync("_live", { recursive: true });
            for (const n of m.meta.hosted) fs.writeFileSync("_live/" + A.file(m, n), A.render(m, n));
            const directory = A.directoryText(m);
            fs.writeFileSync("_live/DIRECTORY.txt", directory);
            fs.writeFileSync("_live/DIRECTORY.yaml", directory);
            fs.writeFileSync("_live/EDITION.txt", m.edition + "\n");
          '

      - name: Build site
        run: |
          mkdir _site
          git ls-files -z | grep -zv '^Blueprint/MASTER.md$' | xargs -0 -I{} cp --parents {} _site/
          cp -r _live _site/live
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
