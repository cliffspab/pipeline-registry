name: Validate Blueprint beta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Blueprint build dependency
        run: python -m pip install PyYAML==6.0.3 python-docx==1.2.0

      - name: Run mechanism guards
        run: python -m unittest discover -s tests

      - name: Rebuild and verify single-source Blueprint
        working-directory: Blueprint
        run: |
          python build.py --check --release

      - name: Verify generated files are committed
        run: |
          git diff --exit-code -- Blueprint

      - name: Report beta payload
        run: |
          cat Blueprint/VERSION.txt
          find Blueprint/UPLOAD -maxdepth 1 -type f -name '*.zip' -print | sort

# Beta validation only. The committed Word volume is not regenerated in CI;
# sealing, local Shift refresh and pCloud publication are outside this job.
