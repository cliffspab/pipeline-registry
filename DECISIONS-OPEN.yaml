  - key: ARC-16
    title: "Model roles & workflow charter — one owner of canonical state; roles by demonstrated strength"
    ruling: >
      Proposed allocation (full text: 220726_arc16_pipeline-roles-charter.md).
      CLAUDE — custody: governance content and canonical record, registry,
      all pushes, monitoring, folder upkeep; not gatekeeper of individual
      copy. CHATGPT — prototyping in a mirror repo; import is one-directional
      (propose in mirror -> operator rules -> Claude imports+pushes; mirror
      kept synced main->mirror); also a processing candidate. GEMINI —
      default processor (engine room) + meta job building the status-report
      command. ROUTING LADDER — Gemini default, ChatGPT overflow/heavy batch,
      Claude judgement-heavy only; same COMPILED in, same output out, every
      lane runs VER-05. STATUS-REPORT COMMAND — must PROBE not interview
      (hand a capability-probe doc, read what returns: fetch+slug readback,
      live .dcx read, Python count, hold a slug); self-report is the
      Gemini-Python trap.
    rationale: >
      Operator charter, 2026-07-22 (Labour Day): role split to promote
      specific skills, avoid conflict, and give the simplest possible
      management. Desk refinements folded in: the import seam as the sole
      divergence re-entry point; difficulty-based routing so the operator
      is not the router; probe-not-interview status command (Gemini-Python
      reading != counting, revised 2026-07-12). Governing principle: one
      source of truth, one writer — the fault line under the stale-cache,
      twin-drift and diverged-push incidents.
    type: STANDING-ARCHITECTURE (candidate)
    dates: [2026-07-22]
    verdict: PENDING

  - key: LEN-13
    title: "Character count is a lossy proxy for column depth on a heavy recast"
    status-thread: DISCUSS
    open-question: >
      A recast that lands OVER target in characters can still set SHORT in
      the column, because tightening the prose also packs the lines better.
      Observed 2026-07-28, AI data centre editorial: delivered 3324 chars
      against a 3292 target (+32, ~1%) and the story still ran short enough
      that the operator had to have design drop in a pull quote.
      Greedy-wrap simulation of filed vs recast copy (monospace, not a
      typesetting engine — treat as indicative only): recast carries 32.9
      chars/line vs filed 32.5 at a 36-char measure, ~1.2% better fill,
      worth roughly one line over a 100-line story. Real but far smaller
      than the hole that was actually filled. CAUSE OF THE REMAINDER IS
      UNKNOWN — do not assume the density effect explains it.
      Open: (a) what margin over target should a heavy recast land, given
      that a ~1% margin is cancelled by the density gain alone; (b) should
      the margin scale with how much of the body was recast; (c) is there
      a depth/line figure available post-paste that would beat characters
      as the acceptance check. Calibration needs one datum the desk has and
      the model does not: how short it ran, in lines or column inches.
    verdict: PENDING
