  - key: VER-04
    title: "Relay search protocol (SEARCHQ): batched web lookups via operator paste to an AI search engine"
    status-thread: >
      PARTIAL RULING 2026-07-11 — operator ruled Gemini the default
      SEARCHQ destination (speed, convenience, proven so far; ChatGPT
      alternative for heavy batch verification). Deployed to BLUEPRINT
      Relay search section same day. Remainder of entry still PENDING.
    ruling: >
      Web lookups the desk cannot or should not spend usage on are
      batched into a SEARCHQ block appended to returned copy. The
      operator pastes it to an AI search engine (Google AI search or
      Bing AI search; relay model was a placeholder) and pastes the
      results back. The executor does NOTHING beyond running a
      multi-part search and returning results verbatim — no analysis,
      no narrative. The desk writes each item as a ready-to-run search
      with the source named in the query: names -> summary/extraction
      of prevalence from bangkokpost.com; positions/status -> the desk
      decides and names the source to query (official site or wire).
      Form specified in the block: only answers, no narrative, one line
      per number, NOT FOUND over nothing-found padding. Copy with
      queries outstanding returns held-not-final, flagged in the Style
      Log. On paste-back: finalise copy, write STATUS entries
      (STA-02/STA-03 unaffected).
      Template:
      SEARCHQ [DDMMYY - slug]
      Run each numbered search. Return results verbatim.
      Only answers, no narrative. One line per number:
      n | result | source, date   —   nothing found: n | NOT FOUND
      No follow-up offers. Source name + date only, no raw URLs.
      If the question's premise is wrong, say so — do not fit the answer.
      1 site:bangkokpost.com "<name>" — most prevalent spelling, most
        recent use, rough hit count
      2 <named source, e.g. official site / Reuters> — <position/status
        question as of today>
      3 <named source> — <figure/date to confirm, verbatim>
    rationale: >
      Op proposal 2026-07-02: batch the queries with the returned copy so a
      single paste to a trusted external engine answers them all — near-zero
      effort for the operator, no desk usage, an authoritative source. Op refinement same day: executor is Google/Bing AI
      search, not a relay model; verbatim multi-part search only, desk
      names the source per item, "only answers, no narrative". Desk
      caveat stands: outstanding queries = held-not-final.
      FIELD TEST 2026-07-02 (5 engines, 3-item block): Google, ChatGPT,
      Brave, DDG all returned usable results; Bing failed (human
      verification wall). Format held except Google's closing offer +
      tracking-URL junk. Cross-engine agreement 4/4 on both facts.
      Brave premise-checked: returned NOT FOUND + correction when the
      desk's question carried a wrong date (UNGA vote was 25 Mar 2026,
      not June) — the protocol caught a desk-side memory error on its
      first run. Template amended: "No follow-up offers. Source name +
      date only — no raw URLs needed."
      OP INTEL post-test: DDG caps input at 500 chars (return
      instruction had to be cut); Brave reply came via Leo after the
      search interface errored; Bing almost certainly broken BY the
      machine-looking format — search interfaces aggressively filter
      machine interaction, use natural language there. ChatGPT Plus =
      frictionless; Google AI advanced sub accepts fully technical
      requests. Two-tier template adopted:
      TIER A (assistants: ChatGPT Plus, Google AI advanced) — the full
      technical block above; may be made more technical still.
      TIER B (search interfaces: DDG, Brave, Bing fallback) — natural
      language, under 500 chars, no pipe schema, reads human. Pattern:
      "Please run three quick searches and give just the answers, one
      line each, with source and date. 1) On bangkokpost.com, which
      spelling of <name> appears most often and most recently? 2) Does
      <figure> currently hold <office>, per <source>? 3) <fact>, per
      <source>? If anything can't be confirmed, just say not found."
      Working default: ChatGPT Plus or Google AI (Tier A block); Tier B
      reserved as fallback; Brave/Leo for premise-sensitive items.
    type: STANDING-RULE (candidate)
    dates: [2026-07-02]
    verdict: PENDING

  - key: VER-05
    title: "Slug verification on every governance-file fetch; cache-buster refetch on suspicion"
    status-thread: >
      RULED 2026-07-15, scope narrowed: approved as desk practice for
      Claude-lane contexts ONLY — not BLUEPRINT doctrine. Op rationale:
      the rule presupposes uniform pull methods, but transports differ
      per model/context (Gemini: operator paste + Drive-synced files,
      cannot fetch; ChatGPT: attachments, fetch unreliable; Claude:
      live fetch). Cross-model verification is operator-side: the SLUG
      READBACK — "read me the slug of each governance doc you hold" —
      verifies any model on any transport in one line, since version
      identity lives inside the file. Deploys to the Claude per-model
      prompt at next recompile; prune this entry on that sweep.
      Cache-buster mechanics verified 150726: Dub passes query params
      through (<shortlink>?v=DDMMYY reaches the raw URL intact).
    ruling: >
      Any model-side fetch of a governance file (any lane: GitHub raw,
      filedn, short link) verifies the slug line on arrival against the
      expected or last-known tag before the content carries authority.
      On suspicion of staleness, refetch once with a throwaway query
      param (?v=DDMMYY) to defeat URL-keyed caches; if the slug still
      disagrees, flag to operator — the operator's browser/IDM is the
      only ground-truth fetch instrument. Freshness ranking of intake
      doors: Drive-connector read (live API) >= live web fetch with slug
      check > synced project knowledge (cached, opaque refresh) >
      uploaded copy (static, ages from upload).
    rationale: >
      INCIDENT 2026-07-15: desk fetch of raw.githubusercontent BLUEPRINT
      returned an 18-day-stale cached copy (270626 tag) though GitHub
      main was current at 6ccf891/110726; provider-side fetch-proxy
      cache, URL-keyed — same URL with ?nocache param returned current
      content minutes later. Triggered a false stale-repo alarm and a
      multi-turn wild goose chase. The slug line was the only detector
      that fired; operator confirmed the drift would not have been caught
      by eye, even with the slug doing its job. All model-side fetches
      (Claude, Gemini, ChatGPT proxies) are cache-suspect by
      construction.
    type: STANDING-RULE (candidate)
    dates: [2026-07-15]
    verdict: PENDING

