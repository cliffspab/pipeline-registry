  - key: ARC-15
    title: "Single master document, rolling internal version; four sections; one slug across the pipeline"
    status-thread: >
      IDENTITY SCHEME RULED 2026-07-15, approved without reservation — the
      slug is the edition, the prefix names the section: extracts stamp <section>@<master-slug>
      (sta@220726_com_new_procedure = "I am STATUS at edition 220726,
      last change com"); the master carries the bare slug — unprefixed
      means "I am the whole". @ separator keeps one greppable token and
      keeps identity visually apart from the facet field, which shares
      the section vocabulary. Readback self-diagnoses: four extracts
      answering different X — the mismatch names the stale file.
      Remaining open: migration itself (ARC-01 tension, extract
      compilation mechanics) — see open-question.
    ruling: >
      Consolidate the four governance files into one master document
      with a rolling internal version. Every change anywhere bumps the
      version; the identifier encodes sequence, date, section and gist
      (e.g. v127_150726_sta_chadchart-secondterm); exact change detail
      lives in a one-line changelog block inside the document, keyed to
      the number. Slug readback becomes a single line on any model,
      any transport; cross-file version skew becomes structurally
      impossible.
    open-question: >
      Tension with ARC-01 (modular over monolithic — large front-loads
      cause errors, op 020726) and the Lean RAG architecture line:
      one doc makes every context carry everything. Candidate
      resolution: master-with-extracts — the single doc is the master
      and sole versioned object; the four sections remain as compiled
      extracts stamped with the master slug, regenerated on change
      (inverts the current COMPILED.txt relationship). Lean contexts
      take an extract; a lagging extract self-identifies by its slug.
      Also weigh: single point of corruption (GATE 1-class bulk swap
      now hits everything at once — mitigated by git + pCloud
      revisions); merge/collision concentration in one file across
      desk, architect and operator edits.
    rationale: >
      Op proposal 150726, following the slug-readback ruling in VER-05:
      one version across all four sections, the internal number moving on
      every change wherever it falls and encoding the location and detail
      of that change. Direction of authority fixed by the operator the same
      session: the four pieces no longer compose the whole — the whole
      decomposes into the four pieces.
    type: ARCHITECTURE (candidate)
    dates: [2026-07-15]
    verdict: PENDING

